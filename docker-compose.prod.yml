version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: home_financial
      POSTGRES_USER: home_financial
      POSTGRES_PASSWORD: home_financial
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  api:
    build:
      context: ./api
    env_file:
      - ./api/.env
    environment:
      DATABASE_URL: postgres://home_financial:home_financial@db:5432/home_financial
    depends_on:
      - db
    ports:
      - "3001:3001"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.prod
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  db-data:
